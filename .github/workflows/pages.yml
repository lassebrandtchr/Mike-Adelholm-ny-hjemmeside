name: Udgiv til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rettigheder som deploy-trinnet kræver for at kunne udgive siden.
permissions:
  contents: read
  pages: write
  id-token: write

# Kører én udgivelse ad gangen; nye push afløser en igangværende.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  udgiv:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true slår Pages til på repoet, hvis det ikke allerede er slået til,
      # så det ikke kræver et manuelt klik i Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Hele repoets rod er selve siden — der er intet byggetrin.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
