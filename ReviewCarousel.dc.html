<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Implementeringsfragment, ikke en side: hentes af dc-runtimet og må
     ikke indekseres. Står derfor heller ikke i sitemap.xml. -->
<meta name="robots" content="noindex,nofollow">
<title>Anmeldelseskarrusel (fragment)</title>
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/fonts.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/colors.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/typography.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/spacing.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/radius.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/elevation.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/motion.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/shadows.css">
<link rel="stylesheet" href="_ds/mike-adelholm-design-system-675d4354-f3e6-4d20-81c6-e6bff42594f8/tokens/base.css">
<style>x-dc{display:none}</style>
<style data-page-css>html,body{background:#080706;}

  /* ═══ Bronzeplade-kort ═══
     Samme bronze som CTA-knappen. Markeret med data-bronze frem for via
     style-strengen, fordi dc-runtimet omskriver style-attributten gennem
     React (#f5c693 bliver til rgb(245, 198, 147)). */
  [data-bronze],[data-bronze] *{color:#1c1107!important}
  [data-bronze]{
    border-color:rgba(28,17,7,.24)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 26px 54px -30px rgba(0,0,0,.85)!important;
  }
  [data-bronze] svg{stroke:#1c1107!important}
  /* Moerke ikonfliser paa pladen beholder deres bronzefarvede ikon */
  [data-bronze] [data-tile] svg{stroke:#f3c79b!important}
  [data-bronze] [data-tile]{border-color:rgba(28,17,7,.3)!important}
</style>
<script defer src="vendor/react-18.3.1.production.min.js"></script>
<script defer src="vendor/react-dom-18.3.1.production.min.js"></script>
<script defer src="site-config.js"></script>
<script defer src="site.js"></script>
<script defer src="support.js"></script>
</head>
<body>
<x-dc>
<section aria-roledescription="karrusel" aria-label="Anmeldelser" style="font-family:'Hanken Grotesk',system-ui,sans-serif;position:relative;width:100%;">

  <!-- Anmeldelserne kommer fra MA_SITE.reviews i site-config.js. Listen er tom,
       indtil der findes godkendt, dateret samtykke for hver enkelt — se
       NEEDS_INPUT.md. Er den tom, vises den ærlige tomme tilstand herunder i
       stedet for eksempeltekst. -->
  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}">
    <div style="max-width:560px;margin:0 auto;padding:clamp(26px,3.4vw,38px);border-radius:22px;background:rgba(255,255,255,.02);border:1px dashed rgba(224,168,124,.3);text-align:center;">
      <span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:rgba(207,138,79,.14);color:#e0a877;font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:20px;margin-bottom:18px;">”</span>
      <p style="margin:0 0 10px;font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#f1e7d7;">Ingen anmeldelser endnu</p>
      <p style="margin:0;font-size:15.5px;line-height:1.65;color:#ab9c87;">Her kommer der ord fra dem, jeg har hjulpet — men først når de selv har skrevet dem og sagt ja til, at de må stå her. Der står ikke noget, jeg har fundet på.</p>
    </div>
  </sc-if>

  <sc-if value="{{ hasReviews }}" hint-placeholder-val="{{ false }}">
    <div ref="{{ stageRef }}" role="group" tabindex="0" aria-label="Anmeldelser — brug piletasterne eller træk for at skifte" onKeyDown="{{ onKeyDown }}" style="position:relative;min-height:308px;width:100%;perspective:1500px;perspective-origin:50% 45%;touch-action:pan-y;cursor:grab;outline-offset:6px;user-select:none;" style-focus="outline:2px solid #cf8a4f;">
      <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="1">
        <article data-bronze="" data-slide="" style="position:absolute;top:50%;left:50%;width:min(352px,86vw);display:flex;flex-direction:column;gap:16px;padding:28px 28px 24px;border-radius:22px;background:linear-gradient(160deg,#f5c693,#cd8450 55%,#b87340);border:1px solid rgba(224,168,124,.22);box-shadow:0 34px 70px -34px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);transform-style:preserve-3d;will-change:transform,opacity;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <span style="font-family:'Archivo',system-ui,sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#c79064;">Anmeldelse</span>
            <span aria-hidden="true" style="font-family:'Archivo',system-ui,sans-serif;font-weight:900;font-size:34px;line-height:.6;color:rgba(207,138,79,.5);">”</span>
          </div>
          <blockquote style="margin:0;flex:1;font-size:16px;line-height:1.62;color:#f0e6d6;">{{ r.quote }}</blockquote>
          <div style="padding-top:14px;border-top:1px solid rgba(224,168,124,.18);">
            <div style="font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#e6cfb4;">{{ r.name }}</div>
            <div style="margin-top:6px;font-size:13.5px;line-height:1.5;color:#8c7e6b;">{{ r.context }}</div>
          </div>
        </article>
      </sc-for>
    </div>

    <div style="margin-top:26px;display:flex;align-items:center;justify-content:center;gap:16px;">
      <button type="button" onClick="{{ prev }}" aria-label="Forrige anmeldelse" style="width:48px;height:48px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(224,168,124,.28);color:#e8d4bf;cursor:pointer;transition:background .3s,border-color .3s,transform .3s cubic-bezier(.22,.61,.36,1);" style-hover="background:rgba(255,255,255,.075);border-color:rgba(224,168,124,.5);transform:translateY(-2px);" style-focus="outline:2px solid #cf8a4f;outline-offset:3px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>

      <div ref="{{ dotsRef }}" style="display:flex;align-items:center;gap:9px;">
        <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="1">
          <button type="button" data-dot="" onClick="{{ r.go }}" aria-label="{{ r.dotLabel }}" style="width:32px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;" style-focus="outline:2px solid #cf8a4f;outline-offset:1px;border-radius:8px;"><span aria-hidden="true" style="display:block;width:8px;height:8px;border-radius:999px;background:#8c7e6b;transition:width .42s cubic-bezier(.22,.61,.36,1),background .3s;"></span></button>
        </sc-for>
      </div>

      <button type="button" onClick="{{ next }}" aria-label="Næste anmeldelse" style="width:48px;height:48px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(224,168,124,.28);color:#e8d4bf;cursor:pointer;transition:background .3s,border-color .3s,transform .3s cubic-bezier(.22,.61,.36,1);" style-hover="background:rgba(255,255,255,.075);border-color:rgba(224,168,124,.5);transform:translateY(-2px);" style-focus="outline:2px solid #cf8a4f;outline-offset:3px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>

    <p aria-live="polite" style="margin:14px 0 0;text-align:center;font-family:'Archivo',system-ui,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8c7e6b;">{{ statusText }}</p>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:520},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;preview&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full' | 'preview'&quot;,&quot;section&quot;:&quot;Karrusel&quot;}}">
/* Karrusellen viser kun anmeldelser fra MA_SITE.reviews. Listen er tom,
   indtil ordlyd, identitetsomfang og dateret samtykke er dokumenteret for
   hver enkelt — derfor ingen eksempelanmeldelser og intet Review-schema. */
class Component extends DCLogic {
  state = { index: 0 };
  stageRef = React.createRef();
  dotsRef = React.createRef();
  drag = 0;

  list() {
    const r = (window.MA_SITE || {}).reviews;
    return Array.isArray(r) ? r.filter((x) => x && x.quote && x.consentDate) : [];
  }

  componentDidMount() {
    this.reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const stage = this.stageRef.current;
    if (!stage) return;

    this.onResize = () => this.layout();
    window.addEventListener('resize', this.onResize, { passive: true });

    let startX = 0, active = false, w = 1;
    const down = (e) => {
      active = true; startX = e.clientX; w = stage.clientWidth || 1;
      stage.style.cursor = 'grabbing';
      if (stage.setPointerCapture && e.pointerId != null) { try { stage.setPointerCapture(e.pointerId); } catch (err) {} }
    };
    const move = (e) => {
      if (!active) return;
      this.drag = -((e.clientX - startX) / (w * 0.34));
      this.layout(true);
    };
    const up = () => {
      if (!active) return;
      active = false;
      stage.style.cursor = 'grab';
      const snap = Math.round(this.state.index + this.drag);
      this.drag = 0;
      this.goTo(snap);
    };
    stage.addEventListener('pointerdown', down);
    stage.addEventListener('pointermove', move);
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('lostpointercapture', up);
    this.cleanup = () => {
      stage.removeEventListener('pointerdown', down);
      stage.removeEventListener('pointermove', move);
      stage.removeEventListener('pointerup', up);
      stage.removeEventListener('pointercancel', up);
      stage.removeEventListener('lostpointercapture', up);
    };

    if (this.props.variant === 'preview') {
      stage.querySelectorAll('[data-slide]').forEach((c) => {
        c.style.width = 'min(312px,86vw)';
        c.style.padding = '24px 24px 20px';
      });
    }
    this.layout();
  }

  componentDidUpdate() { this.layout(); }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    if (this.cleanup) this.cleanup();
  }

  layout(dragging) {
    const stage = this.stageRef.current;
    if (!stage) return;
    const cards = Array.from(stage.querySelectorAll('[data-slide]'));
    if (!cards.length) return;

    /* Kortene har ikke længere fast højde. Scenen måles efter det højeste
       kort, så intet indhold falder uden for sin plade — uanset bredde,
       skriftstørrelse eller hvor lang anmeldelsen er. */
    cards.forEach((c) => { c.style.height = 'auto'; });
    const tallest = cards.reduce((m, c) => Math.max(m, c.offsetHeight), 0);
    stage.style.height = (tallest + 84) + 'px';
    cards.forEach((c) => {
      c.style.height = tallest + 'px';
      c.style.margin = (-tallest / 2) + 'px 0 0 ' + (-c.offsetWidth / 2) + 'px';
    });

    const cw = cards[0].offsetWidth || 352;
    const narrow = stage.clientWidth < 640;
    const spread = narrow ? cw * 0.46 : cw * 0.62;
    const depth = narrow ? 70 : 170;
    const rot = narrow ? 16 : 34;
    const pos = this.state.index + (dragging ? this.drag : 0);

    cards.forEach((card, i) => {
      const o = i - pos;
      const a = Math.abs(o);
      const clamped = Math.max(-2.4, Math.min(2.4, o));
      const scale = Math.max(0.6, 1 - a * 0.09);
      /* Kun transform og opacity animeres — begge kan køre på compositoren. */
      card.style.transition = (dragging || this.reduced) ? 'none' : 'transform .55s cubic-bezier(.22,.61,.36,1),opacity .45s cubic-bezier(.22,.61,.36,1)';
      card.style.transform = 'translate3d(' + (clamped * spread) + 'px,0,' + (-a * depth) + 'px) rotateY(' + (-clamped * rot) + 'deg) scale(' + scale + ')';
      card.style.opacity = a > 2.35 ? '0' : String(Math.max(0, 1 - a * 0.3));
      card.style.zIndex = String(100 - Math.round(a * 10));
      card.style.pointerEvents = a < 0.5 ? 'auto' : 'none';
      card.style.borderColor = a < 0.5 ? 'rgba(224,168,124,.4)' : 'rgba(224,168,124,.16)';
      card.setAttribute('aria-hidden', a < 0.5 ? 'false' : 'true');
    });

    const dots = this.dotsRef.current;
    if (dots) {
      Array.from(dots.querySelectorAll('[data-dot]')).forEach((b, i) => {
        const on = i === this.state.index;
        const s = b.firstElementChild;
        if (s) { s.style.width = on ? '26px' : '8px'; s.style.background = on ? '#cf8a4f' : '#8c7e6b'; }
        b.setAttribute('aria-current', on ? 'true' : 'false');
      });
    }
  }

  goTo(i) {
    const last = Math.max(0, this.list().length - 1);
    const n = Math.max(0, Math.min(last, i));
    if (n === this.state.index) { this.layout(); return; }
    this.setState({ index: n });
  }

  renderVals() {
    const list = this.list();
    return {
      isEmpty: list.length === 0,
      hasReviews: list.length > 0,
      reviews: list.map((r, i) => ({
        quote: r.quote,
        name: r.name || 'Anonym',
        context: r.context || '',
        dotLabel: 'Gå til anmeldelse ' + (i + 1),
        go: () => this.goTo(i)
      })),
      stageRef: this.stageRef,
      dotsRef: this.dotsRef,
      statusText: 'Anmeldelse ' + (this.state.index + 1) + ' af ' + list.length,
      prev: () => this.goTo(this.state.index - 1),
      next: () => this.goTo(this.state.index + 1),
      onKeyDown: (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault(); this.goTo(this.state.index - 1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); this.goTo(this.state.index + 1); }
        else if (e.key === 'Home') { e.preventDefault(); this.goTo(0); }
        else if (e.key === 'End') { e.preventDefault(); this.goTo(list.length - 1); }
      }
    };
  }
}
</script>
</body>
</html>
